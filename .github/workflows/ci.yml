name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make venv
      - run: make spec-check
      - run: make audit-check

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r harness/requirements.txt
      - run: python3 tools/check_lean.py
      - run: python3 tools/check_vectors.py
      - run: python3 tools/check_flows.py

  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install protobuf compiler for the node parser build
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make venv
      - run: make build
      - name: Parse built and rendered terms with the node parser
        env:
          RCHAIN_RUST_DIR: ${{ github.workspace }}/rnode-rust
        run: make parse-check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache mdBook
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/registry
          key: mdbook-0.5.4-${{ runner.os }}
      - name: Install mdBook 0.5.4
        run: |
          if ! command -v mdbook >/dev/null; then
            cargo install mdbook --locked --version 0.5.4
          fi
          mdbook --version
      - run: make docs-check PY=python3

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust format and lint
        run: make client-lint
      - name: Rust tests
        run: make client-test
      - name: WASM type check
        run: make client-wasm
      - name: Web dependencies
        run: npm ci --prefix web
      - name: Build WASM
        run: npm --prefix web run wasm:build
      - name: WASM smoke (offline)
        run: npm --prefix web run test:wasm
      - name: Web typecheck
        run: npm --prefix web run typecheck
      - name: Web unit tests
        run: npm --prefix web test
      - name: Web build
        run: npm --prefix web run build

  devnet:
    # The behavioural campaign needs Docker, r-cash and a local rholo devnet. It is not
    # run on every PR. Run it manually or on the nightly schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RCASH_DIR: ${{ github.workspace }}/rholo
      RHOLO_DIR: ${{ github.workspace }}/rnode-rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rhovision-org/r-cash
          ref: 49b441dea4f5561992387ed670ab263fcd5dd164
          path: rholo
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: r-share harness dependencies
        run: make venv
      - name: r-cash harness dependencies
        run: make -C "$RCASH_DIR" venv
      - name: Build the rholo devnet image
        run: make -C "$RCASH_DIR" image RHOLO_DIR="$RHOLO_DIR"
      - name: Start the devnet and wait for health
        run: |
          make devnet
          make devnet-wait
      - name: Generate r-cash devnet keys
        run: make rcash-keys
      - name: Bootstrap the r-cash rail
        run: make rcash-bootstrap
      - name: Install r-share
        run: make keys install
      - name: Run behavioural suites
        run: make unit-all
      - name: Run audit reproductions
        run: make audit-dynamic
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Create client fixtures and catalogue
        run: make client-fixtures
      - name: Run the client journey
        run: make client-journey
      - name: Build the web app
        run: npm --prefix web run build
      - name: Create encrypted admin profiles for the browser journey
        run: make client-keystores
      - name: Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: cd web && npx playwright test
      - name: Devnet diagnostics
        if: failure()
        run: |
          docker ps -a || true
          curl -s http://localhost:40403/api/v1/status || true
          curl -s http://localhost:40405/api/v1/status || true
          ls -la .devnet "$RCASH_DIR/.devnet" "$RCASH_DIR/deployments" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-results
          path: |
            deployments/suite-results.json
            deployments/client-results.json
            web/test-results
          if-no-files-found: ignore
