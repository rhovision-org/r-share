name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make venv
      - run: make spec-check

  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install protobuf compiler for the node parser build
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make venv
      - run: make build
      - name: Parse built and rendered terms with the node parser
        env:
          RCHAIN_RUST_DIR: ${{ github.workspace }}/rnode-rust
        run: make parse-check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache mdBook
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/registry
          key: mdbook-0.5.4-${{ runner.os }}
      - name: Install mdBook 0.5.4
        run: |
          if ! command -v mdbook >/dev/null; then
            cargo install mdbook --locked --version 0.5.4
          fi
          mdbook --version
      - run: make docs-check PY=python3

  devnet:
    # The behavioural campaign needs Docker, r-cash and a local rholo devnet. It is not
    # run on every PR. Run it manually or on the nightly schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rhovision-org/r-cash
          ref: 49b441dea4f5561992387ed670ab263fcd5dd164
          path: rholo
      - uses: actions/checkout@v4
        with:
          repository: rchain-community/rchain-rust
          ref: e2d073dcd02f1e560ccb84749937138a1e184b0b
          path: rnode-rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: make venv
      - name: r-cash harness dependencies
        env:
          RCASH_DIR: ${{ github.workspace }}/rholo
        run: make -C "$RCASH_DIR" venv
      - name: Build the rholo devnet image
        env:
          RCASH_DIR: ${{ github.workspace }}/rholo
          RHOLO_DIR: ${{ github.workspace }}/rnode-rust
        run: make -C "$RCASH_DIR" image RHOLO_DIR="$RHOLO_DIR"
      - name: devnet and suites
        env:
          RCASH_DIR: ${{ github.workspace }}/rholo
          RHOLO_DIR: ${{ github.workspace }}/rnode-rust
        run: |
          make devnet
          make devnet-wait
          make rcash-bootstrap
          make keys install
          make unit-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-results
          path: deployments/suite-results.json
          if-no-files-found: ignore
