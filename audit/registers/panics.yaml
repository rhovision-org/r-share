schema: rshare.abort-arms/v1
description: >-
  Every `1/0` in a deploy term. `sites` are keyed by file, enclosing contract and
  ordinal within that contract; line numbers are deliberately not stored. Register
  guards are counted per file separately: they abort the install deploy when Root
  refuses a registration. Rollback aborts are intentional and rely on deploy atomicity;
  recoverable entries are `convert-deferred` until a test covers the failure path.
