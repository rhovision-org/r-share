- id: F-010
  title: Documentation contradicts source on terminality, reset, pause and invariant 7
  severity: P2
  class: docs
  status: fixed
  confidence: high
  components:
  - docs
  arms: []
  hazards:
  - HZ-010
  invariants:
  - INV-7
  evidence_level: E2
  evidence:
  - kind: source
    ref: docs/reference/status-vocabulary.md
  - kind: source
    ref: docs/concepts/concurrency-doctrine.md
  - kind: source
