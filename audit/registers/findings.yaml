  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: acquire takes listingState, then resolves component:unit-factory and calls UnitFactory.slotScan while the cell is empty, then reposts. The docs call this one commit/no external await.
  preconditions: A concurrent process in the same deploy attempts to use listingState while acquire is awaiting UnitFactory.
  impact: The implementation is safe under deploy atomicity but is not the single-comm-event pattern the Lean commit model and doctrine describe. A stale-write or blocking class exists if the pattern is copied elsewhere; the deployed acquire tie cannot honestly be called linearizable from the current model.
  reproduction: Planned unit_cell_liveness/acquire interleaving case; static trace 14:644-686.
  proposed_fix: R-015
  lean_backlog:
  - THM-AWAIT
  reviewer: pending
  verified_at: dee7cff/2026-11-04
