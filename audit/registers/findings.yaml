- id: F-015
  title: Terms.pricePerSlot is not binding on unit prices
  severity: P2
  class: integrity
  status: suspected
  confidence: medium
  components:
  - Terms
  - ListingContract
  arms:
  - ListingContract@"ensureUnit"
  - ListingContract@"acquire"
