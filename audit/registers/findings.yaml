  - kind: test-gap
    ref: no factory-failure test
  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: After taking guestBookState, the Nil branch calls the guest-ledger factory. If the factory returns a refusal or is unavailable, the arm returns without guestBookState!(s2), leaving the singleton index empty.
  preconditions: A guest with no ledger; GuestLedgerFactory create returns (false, ...) or the factory cannot be resolved.
  impact: Every later getOrCreate blocks waiting on an empty cell. New guests cannot obtain a ledger; existing guests are unaffected only because their path peeks an existing entry. This is a platform-wide onboarding outage until redeploy.
  reproduction: 'Static trace: 20_booking.rho:20-67; planned unit_cell_liveness and fault-injection suite.'
  proposed_fix: R-002
  lean_backlog:
  - THM-CELL
  reviewer: pending
  verified_at: dee7cff/2026-11-04
- id: F-003
  title: GuestLedgerPay leaves a pending op when the Bond factory is unavailable
  severity: P0
