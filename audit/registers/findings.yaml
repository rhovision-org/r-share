  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: status-vocabulary calls redeemed terminal although the contract and Lean terminal predicate exclude it. concurrency-doctrine calls acquire a single commit and reset an emergency path without stating the token-gate bypass. authority-and-refusal describes Unit.reset, which no longer exists. invariants said invariant 7 was proved; the audit added summaryOf_rent/count but rentOf_eq_sum is still open, and the formal-status line now says so. The other docs contradictions remain.
  preconditions: A reader relies on the docs for behaviour or proof status.
  impact: Operators and reviewers can misjudge terminality, emergency reset and formal coverage. This is a correctness-of-claims finding, not a contract exploit.
  reproduction: Read the cited lines and compare to 22_booking_contract.rho:624, 14_listing_contract.rho:768 and spec/lean/RShare/Model/Allocator.lean.
  proposed_fix: R-020
  lean_backlog:
  - THM-RENT
  reviewer: pending
  verified_at: dee7cff/2026-11-04
- id: F-011
  title: acquire holds listingState across an external UnitFactory call
  severity: P1
  class: concurrency/docs
  status: fixed
  confidence: high
  components:
  - ListingContract
  arms:
  - ListingContract@"acquire"
  hazards:
