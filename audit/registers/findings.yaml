- id: F-004
  title: Provider can capture rent by never checking in and claiming no-show
  severity: P0
  class: value/fairness
  status: fixed
  confidence: high
  components:
  - BookingContract
  arms:
  - BookingContract@"claimNoShow"
  - BookingContract@"dispute"
  hazards:
  - HZ-004
  invariants:
  - INV-3
  evidence_level: E2
  evidence:
  - kind: source
    ref: contracts/src/deploy/22_booking_contract.rho:931
  - kind: source
    ref: contracts/src/deploy/22_booking_contract.rho:759
  - kind: test
    ref: harness/unit_claims.py:105 exercises the happy path only
  - kind: test
    ref: audit/evidence/2026-11-04-dee7cff/results/suite-results.json
  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: claimNoShow is provider-only, available from confirmed after checkInHeight + noShowBlocks, and terminal. The provider controls checkIn, so it can simply not check in and then claim no-show. The guest cannot dispute from confirmed; dispute only accepts checkedIn or checkedOut.
  preconditions: A confirmed booking; provider does not check in; now >= checkInHeight + noShowBlocks.
  impact: The provider receives rent net of fee without delivering the service; the guest has no on-chain dispute path. This is an economic fairness hazard, not a double spend.
  reproduction: 'Planned unit_adversarial case: book, wait past checkInHeight + noShowBlocks, call claimNoShow as provider, then attempt dispute as guest; expect dispute refusal "closed".'
  proposed_fix: R-004
  lean_backlog:
  - THM-NOSHOW
  reviewer: pending
  verified_at: dee7cff/2026-11-04
- id: F-005
  title: settle from redeemed does not require the event to be over
  severity: P1
  class: state/time
  status: fixed
  confidence: high
  components:
  - BookingContract
  arms:
  - BookingContract@"settle"
  - BookingContract@"redeem"
  - BookingContract@"closeEvent"
  hazards:
  - HZ-005
  invariants:
  - INV-3
  evidence_level: E2
  evidence:
  - kind: source
    ref: contracts/src/deploy/22_booking_contract.rho:624
  - kind: source
    ref: contracts/src/deploy/22_booking_contract.rho:1033
  - kind: test
    ref: audit/evidence/2026-11-04-dee7cff/results/suite-results.json
  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: settle accepts checkedOut or redeemed and only applies the deposit-release height check to checkedOut. closeEvent separately requires now >= checkOutHeight. A provider can redeem a confirmed event booking and immediately settle before the event.
  preconditions: An event booking in confirmed; provider calls redeem; then anyone calls settle before checkOutHeight.
  impact: Escrow is released before the event. If the event is later cancelled or not delivered, the guest has no refund path; the provider has already been paid.
  reproduction: 'Planned unit_event_timing: create an event booking with checkOutHeight in the future, redeem, settle, and compare with closeEvent refusal "too early".'
  proposed_fix: R-005
  lean_backlog:
  - THM-EVENT
  reviewer: pending
  verified_at: dee7cff/2026-11-04
- id: F-006
  title: Admin sets accept duplicate public keys and a threshold of one
  severity: P0
  class: authorization
  status: fixed
  confidence: high
  components:
  - AdminGuard
  - ShareAdmin
  - Root
  - ProviderContract
  - ListingContract
  - BookingContract
  arms:
  - ShareRoot@"admin"
  - ShareAdmin@"admin"
  - ProviderContract@"setAdmins"
  - ListingContract@"setAdmins"
  - BookingContract@"setAdmins"
  hazards:
  - HZ-006
  invariants:
  - INV-10
  evidence_level: E2
  evidence:
  - kind: source
    ref: contracts/src/deploy/02_admin.rho:31
  - kind: source
    ref: contracts/src/deploy/02_admin.rho:116
  - kind: source
    ref: contracts/src/deploy/14_listing_contract.rho:1051
  - kind: source
    ref: contracts/src/deploy/22_booking_contract.rho:1127
  - kind: test
    ref: audit/evidence/2026-11-04-dee7cff/results/suite-results.json
  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: AdminGuard.guardCount walks the stored key list and counts each entry for which any signature verifies. It does not require keys to be distinct. setAdmins validates only 1 <= threshold <= newAdmins.length(); duplicate keys are accepted and threshold 1 is legal on Root/ShareAdmin.
  preconditions: A 2-of-3 set contains the same public key twice, or an admin action sets threshold 1.
  impact: With keys [A,A,B] and threshold 2, one signature from A satisfies two entries, so a nominal 2-of-3 becomes 1-of-3. With threshold 1, one compromised key controls the object. This is a governance takeover hazard.
  reproduction: 'Planned unit_admin_keys: deploy a test AdminGuard-compatible set with duplicate keys, sign once, and observe threshold success; then test threshold=1 on ShareAdmin.'
  proposed_fix: R-006
  lean_backlog:
  - THM-ADMIN
  reviewer: pending
  verified_at: dee7cff/2026-11-04
