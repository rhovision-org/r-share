- id: F-013
  title: Refund and transfer cutoffs can precede the slot start
  severity: P2
  class: time
  status: fixed
  confidence: high
  components:
  - Terms
  - Remedy
  arms:
  - Remedy@"cancel"
  - Terms@"validate"
  hazards:
  - HZ-013
  invariants: []
  evidence_level: E2
  evidence:
  - kind: source
    ref: contracts/src/deploy/03_terms.rho:73
  - kind: source
