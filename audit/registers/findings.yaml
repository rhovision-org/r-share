  description: ShareAdmin.pauseAll is read only by GuestLedgerGate. ListingContract.acquire checks listing status and unit status but not global pause or provider status. ListingFactory.create checks provider ownership but not provider status.
  preconditions: Global pause is active; a caller invokes ListingContract.acquire directly with a valid bookingId, slots and release token, or creates a listing while the provider is paused.
  impact: An emergency pause does not stop direct slot acquisition, and provider pause does not stop direct listing creation. The operator-facing claim that pause blocks new bookings is narrower than it appears.
  reproduction: Static trace plus planned pause-bypass case; direct acquire requires a release token but no escrow.
  proposed_fix: R-009
