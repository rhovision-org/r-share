  description: The registered factory checks only that the deployer-derived guestId equals data.guestId. It does not require a GuestLedger reservation, a listing check, a real Bond, or trusted provider/rent/deposit fields.
  preconditions: Any caller with a REV account and the factory URI constructs a data map with its own guestId.
  impact: Anyone can create fake BookingContracts with arbitrary providerId, listingUri, rents, deposits, admins and status, polluting provider views and enabling misleading share links. No direct theft is demonstrated, but the factory is not an authenticated booking boundary.
  reproduction: Planned unit_adversarial direct-factory case using the fixture booking_term with attacker-chosen data.
  proposed_fix: R-008
