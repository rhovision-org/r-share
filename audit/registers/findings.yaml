  description: Terms carries pricePerSlot and the terms hash covers it, but ensureUnit accepts a separate per-unit pricePerSlot and acquire computes rent from the unit price. Nothing enforces equality with the terms price.
  preconditions: A provider creates a unit whose price differs from the listing terms price.
  impact: A client that displays Terms.pricePerSlot can show a price different from the amount actually escrowed. This is a price-integrity hazard, not a contract arithmetic bug.
  reproduction: Static trace; planned unit_listing case with terms price 10 and unit price 20, then quote.
