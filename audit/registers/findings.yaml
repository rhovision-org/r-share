  - kind: test
    ref: harness/unit_cutoffs.py
  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: Terms.validate bounds each refund/cutoff window to 0..100000 but does not relate it to slot start or duration. Remedy.cancel subtracts the window from startHeight; a window larger than the start produces a negative cutoff and silently falls to the late-refund branch.
  preconditions: A listing created near genesis or with a large fullRefundBeforeBlocks/partialRefundBeforeBlocks/eventTransferCutoffBlocks relative to its slot start.
  impact: A guest can receive a worse refund than the policy appears to promise, or a ticket transfer can be impossible. No value is created, but policy semantics are surprising.
  reproduction: Planned unit_boundaries with startHeight below the cutoff and now at the boundary.
  proposed_fix: R-010
  lean_backlog:
  - THM-TERMS
  reviewer: pending
  verified_at: dee7cff/2026-11-04
