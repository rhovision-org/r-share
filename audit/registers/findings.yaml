- id: F-001
  title: reset frees booked and held slots
  severity: P0
  class: state/value
  status: fixed
  confidence: high
  components:
  - ListingContract
  arms:
  - ListingContract@"reset"
  hazards:
  - HZ-001
  invariants:
  - INV-6
  - INV-8
  evidence_level: E2
  evidence:
  - kind: source
    ref: contracts/src/deploy/14_listing_contract.rho:768
  - kind: test-gap
    ref: no reset suite in harness/
  - kind: test
    ref: audit/evidence/2026-11-04-dee7cff/results/suite-results.json
  - kind: test
    ref: audit/evidence/2026-11-04-remediation/manifest.json
  description: ListingContract("reset") consumes listingState, checks only that the caller is the listing owner, and writes ["free",0] over the slot record regardless of whether it is free, held, or booked.
  preconditions: Caller is the listing provider owner; a live held or booked slot exists.
  impact: A provider can free a slot that a booking still owns, allowing a second acquire and a double sale. The first booking can still settle against the missing slot. This contradicts invariants 6 and 8 and the Lean single-owner theorem, which does not model reset.
  reproduction: 'Static trace: 14_listing_contract.rho:768-798; run the planned unit_reset_safety suite on a fresh devnet.'
  proposed_fix: R-001
  lean_backlog:
  - THM-RESET
  reviewer: pending
  verified_at: dee7cff/2026-11-04
- id: F-002
  title: GuestBook.getOrCreate can consume guestBookState without reposting
  severity: P0
  class: liveness/state
  status: fixed
  confidence: high
  components:
  - GuestBook
  arms:
  - GuestBook@"getOrCreate"
  hazards:
