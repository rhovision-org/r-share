  description: GuestLedgerPay reserves a fresh opId, acquires slots, then resolves the Bond factory. The non-(true, BondFactory) branch returns (false, "bond factory unavailable") without GuestLedgerDrop or a listing release.
  preconditions: A guest books a valid listing while component:bond-factory cannot be resolved.
  impact: 'The opId stays {"pending": true} forever, so replay refuses "pending"; the held slots remain until untilHeight. The guest cannot retry the same intent and the inventory is temporarily stranded.'
  reproduction: 'Static trace: 23_guest_ledger.rho:248-286; fault-injection fixture with missing component:bond-factory.'
  proposed_fix: R-003
