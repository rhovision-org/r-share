schema: rshare.hazards/v1
total: 54
hazards:
- id: HZ-001
  node: N09
  arm: ListingContract@"reset"
  guide_word: part_of
  parameter: slot ownership
  deviation: a booked or live-held slot is freed and can be acquired by a second booking
  causes:
  - reset overwrites any slot record
  - owner-only authority
  - no expiry/token/state check
  consequences:
    on_chain: two live bookings reference one slot; first booking can still settle
    operational: inventory loss; probe no longer trustworthy
    safety: physical asset double allocation for car/robot listings
  severity: S4
  likelihood: L2
  risk: high
  controls: listing owner auth only; reset is not tested
  findings:
  - F-001
  tests:
  - T-RESET
  lean: THM-RESET
  disposition: mitigate
  owner: contracts
  evidence:
  - contracts/src/deploy/14_listing_contract.rho:768
- id: HZ-002
  node: N10
  arm: GuestBook@"getOrCreate"
  guide_word: lost
  parameter: state cell
  deviation: guestBookState is consumed and not reposted on factory failure
  causes:
  - take then external factory call
  - refusal branch lacks repost
  consequences:
    on_chain: singleton guest index empty; later getOrCreate blocks
    operational: new guests cannot onboard
    safety: none
  severity: S4
  likelihood: L2
  risk: high
  controls: none; no fault-injection test
  findings:
  - F-002
  tests:
  - T-CELL
  lean: THM-CELL
  disposition: mitigate
  owner: contracts
  evidence:
  - contracts/src/deploy/20_booking.rho:20
