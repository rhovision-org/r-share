# Cornerstone flow manifest. Each rule names the Lean declaration that carries the arm's
# safety obligation. `proved-model` means the theorem is about the Lean model, not a
# refinement of the deployed Rholang. `owed` marks an arm outside the cornerstone model.
schema: rshare.flows/v1
subsystem: cornerstone
source_globs:
  - contracts/src/deploy/13_unit.rho
  - contracts/src/deploy/14_listing_contract.rho
  - contracts/src/deploy/15_bond.rho
  - contracts/src/deploy/34_booking_instance.rho
  - contracts/src/deploy/04_remedy.rho
  - contracts/src/deploy/32_cover_pool.rho
  - contracts/src/deploy/33_cover_policy.rho
invariants:
  S1: {statement: "acquisition is one reservation append", lean: RShare.Allocator.acquire_none_or_reservation, lean_status: proved-model}
  S2: {statement: "no slot has two owners", lean: RShare.Allocator.acquire_no_double_owner, lean_status: proved-model}
  S3: {statement: "a live hold refuses the whole set", lean: RShare.Allocator.acquire_refuses_occupied, lean_status: proved-model}
  S7: {statement: "the hold is bounded", lean: RShare.Allocator.acquire_bounded, lean_status: proved-model}
  S9: {statement: "a terminal booking has no outgoing step", lean: RShare.Booking.terminal_no_step, lean_status: proved-model}
  C13: {statement: "a deposit claim is frozen after attach", lean: RShare.Cover.claimDeposit_frozen_after_attach, lean_status: proved-model}
  C14: {statement: "a claim token pays at most once", lean: RShare.Cover.pay_once, lean_status: proved-model}
  C15: {statement: "an attached policy cannot expire before a pending claim", lean: RShare.Cover.expire_cannot_precede_pending_claim, lean_status: proved-model}
  C16: {statement: "a missing pool entry cannot block terminal settle", lean: RShare.Cover.settle_ignores_deleted_pool, lean_status: proved-model}
  C17: {statement: "payout implies an authorized attached claim", lean: RShare.Cover.payout_implies_authorized_attached, lean_status: proved-model}
rules:
  - {id: C-commit, kind: cell, lean: RShare.commit_all_or_none, lean_status: proved-model}
  - {id: C-peek-put, kind: cell, lean: RShare.peek_then_put_rejected, lean_status: proved-model}
  - {id: C-lost-cell, kind: cell, lean: RShare.take_without_put_not_wf, lean_status: proved-model}
  - {id: C-nested, kind: cell, lean: RShare.nested_call_rejected, lean_status: proved-model}

  - id: L-acquire
    arm: 'ListingContract@"acquire"'
    source: contracts/src/deploy/14_listing_contract.rho
    lean: RShare.Allocator.acquire_no_double_owner
    lean_status: proved-model
    invariants: [S1, S2, S3, S7]
  - id: L-confirm
    arm: 'ListingContract@"confirm"'
    source: contracts/src/deploy/14_listing_contract.rho
    lean: RShare.Allocator.confirm_requires_token
    lean_status: proved-model
    invariants: [S1, S2]
  - id: L-release
    arm: 'ListingContract@"release"'
    source: contracts/src/deploy/14_listing_contract.rho
    lean: RShare.Allocator.release_clears_token
    lean_status: proved-model
    invariants: [S2]
  - id: L-probe
    arm: 'ListingContract@"probe"'
    source: contracts/src/deploy/14_listing_contract.rho
    lean: RShare.Allocator.publicView_no_token
    lean_status: proved-model
  - id: L-quote
    arm: 'ListingContract@"quote"'
    source: contracts/src/deploy/14_listing_contract.rho
    lean: RShare.Allocator.checkAcquire_free
    lean_status: proved-model
  - id: L-ensure-unit
    arm: 'ListingContract@"ensureUnit"'
    source: contracts/src/deploy/14_listing_contract.rho
    lean: RShare.Allocator.ensureUnit_head
    lean_status: proved-model
  - id: L-status
    arm: 'ListingContract@"pause"'
    source: contracts/src/deploy/14_listing_contract.rho
    lean: RShare.Allocator.setStatus_applied
    lean_status: proved-model
  - {id: L-reset, arm: 'ListingContract@"reset"', source: contracts/src/deploy/14_listing_contract.rho, lean_status: owed}
  - {id: L-pause-unit, arm: 'ListingContract@"pauseUnit"', source: contracts/src/deploy/14_listing_contract.rho, lean_status: owed}
  - {id: L-admin, arm: 'ListingContract@"adminPause"', source: contracts/src/deploy/14_listing_contract.rho, lean_status: owed}

  - {id: B-accept, arm: 'BookingContract@"accept"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.accept_only_from_requested, lean_status: proved-model}
  - {id: B-reject, arm: 'BookingContract@"reject"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.reject_only_from_requested, lean_status: proved-model}
  - {id: B-cancel, arm: 'BookingContract@"cancel"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.cancel_only_from_open, lean_status: proved-model}
  - {id: B-checkin, arm: 'BookingContract@"checkIn"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.checkIn_only_from_confirmed, lean_status: proved-model}
  - {id: B-checkout, arm: 'BookingContract@"checkOut"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.checkOut_only_from_checkedIn, lean_status: proved-model}
  - {id: B-settle, arm: 'BookingContract@"settle"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.settle_from_checked_or_redeemed_or_disputed, lean_status: proved-model}
  - {id: B-dispute, arm: 'BookingContract@"dispute"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Cover.dispute_refused_pending_claim, lean_status: proved-model, invariants: [C13]}
  - {id: B-arbitrate, arm: 'BookingContract@"arbitrate"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.resolve_step_only_from_disputed, lean_status: proved-model}
  - {id: B-resolve-dispute, arm: 'BookingContract@"resolveDispute"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.resolve_step_only_from_disputed, lean_status: proved-model}
  - {id: B-expire, arm: 'BookingContract@"expire"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.expire_only_from_requested, lean_status: proved-model}
  - {id: B-nosHow, arm: 'BookingContract@"claimNoShow"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.noShowClaim_only_from_confirmed, lean_status: proved-model}
  - {id: B-dispute-noShow, arm: 'BookingContract@"disputeNoShow"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.noShowDispute_only_from_claimed, lean_status: proved-model}
  - {id: B-resolve-noShow, arm: 'BookingContract@"resolveNoShow"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Booking.noShowResolves, lean_status: proved-model}
  - {id: B-claim, arm: 'BookingContract@"claimDeposit"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Cover.claimDeposit_frozen_after_attach, lean_status: proved-model, invariants: [C13]}
  - {id: B-resolve-deposit, arm: 'BookingContract@"resolveDeposit"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Cover.pay_requires_attach, lean_status: proved-model, invariants: [C17]}

  - {id: CV-authorize, arm: 'CoverPolicy@"authorize"', source: contracts/src/deploy/33_cover_policy.rho, lean: RShare.Cover.authorize_fixes_token, lean_status: proved-model, invariants: [C14]}
  - {id: CV-attach, arm: 'CoverPolicy@"attach"', source: contracts/src/deploy/33_cover_policy.rho, lean: RShare.Cover.attach_requires_authorized_token, lean_status: proved-model, invariants: [C17]}
  - {id: CV-expire, arm: 'CoverPolicy@"expire"', source: contracts/src/deploy/33_cover_policy.rho, lean: RShare.Cover.expire_cannot_precede_pending_claim, lean_status: proved-model, invariants: [C15]}
  - {id: CV-settle-key, arm: 'CoverSettle@"settleKey"', source: contracts/src/deploy/32_cover_pool.rho, lean: RShare.Cover.settle_ignores_deleted_pool, lean_status: proved-model, invariants: [C16]}
  - {id: CV-close, arm: 'CoverPool@"close"', source: contracts/src/deploy/32_cover_pool.rho, lean: RShare.Cover.settle_ignores_deleted_pool, lean_status: proved-model, invariants: [C16]}
  - {id: CV-release, arm: 'CoverPool@"release"', source: contracts/src/deploy/32_cover_pool.rho, lean: RShare.Cover.settle_ignores_deleted_pool, lean_status: proved-model, invariants: [C16]}
  - {id: CV-pay, arm: 'CoverSettle@"pay"', source: contracts/src/deploy/32_cover_pool.rho, lean: RShare.Cover.pay_once, lean_status: proved-model, invariants: [C14]}
  - {id: CV-token, arm: 'BookingContract@"attachClaim"', source: contracts/src/deploy/34_booking_instance.rho, lean: RShare.Cover.claim_token_one_time, lean_status: proved-model, invariants: [C14]}
  - {id: B-ticket, arm: 'BookingContract@"transferTicket"', source: contracts/src/deploy/34_booking_instance.rho, lean_status: owed}

  - {id: D-pay, arm: 'Bond@"pay"', source: contracts/src/deploy/15_bond.rho, lean: RShare.Bond.pay_once, lean_status: proved-model}
  - {id: R-fee, arm: 'Remedy@"fee"', source: contracts/src/deploy/04_remedy.rho, lean: RShare.Remedy.fee_le_rent, lean_status: proved-model}
  - {id: R-cancel, arm: 'Remedy@"cancel"', source: contracts/src/deploy/04_remedy.rho, lean: RShare.Remedy.fullRefund_conserves, lean_status: proved-model}
  - {id: R-noshow, arm: 'Remedy@"noShow"', source: contracts/src/deploy/04_remedy.rho, lean: RShare.Remedy.noShow_conserves, lean_status: proved-model}
  - {id: R-split, arm: 'Remedy@"depositSplit"', source: contracts/src/deploy/04_remedy.rho, lean: RShare.Remedy.depositSplit_conserves, lean_status: proved-model}

core_arms:
  - 'ListingContract@"acquire"'
  - 'ListingContract@"confirm"'
  - 'ListingContract@"release"'
  - 'ListingContract@"probe"'
  - 'BookingContract@"settle"'
  - 'BookingContract@"dispute"'
  - 'BookingContract@"resolveDispute"'
  - 'BookingContract@"expire"'
  - 'Bond@"pay"'
  - 'Remedy@"fee"'
  - 'Remedy@"cancel"'
  - 'Remedy@"noShow"'
  - 'Remedy@"depositSplit"'
