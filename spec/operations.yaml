# Hot-operation budgets for the per-listing allocator.
#
# root_resolves: number of ShareRoot("resolve"/"resolveMany") calls per arm.
# registry_lookups: number of rl! calls per arm.
# consumed_cells: cells consumed by the arm. "short" means the cell is reposted before
#   any external call; "held" means it is held across a callee, as with bookingState.
# acquire is one take/await/put: it takes the listing cell after the clock read, checks
# the pause and provider gates, awaits UnitFactory.slotScan, and reposts the new state.
# Other listing arms block while the cell is empty; this is not a single comm event.

operations:
  acquire:
    root_resolves_max: 3               # UnitFactory, Admin
    registry_lookups_max: 2            # listing URI, provider URI
    consumed_cells: [listingState held]
    peeks: []
  confirm:
    root_resolves_max: 0
    registry_lookups_max: 1            # listing URI
    consumed_cells: [listingState]
  release:
    root_resolves_max: 0
    registry_lookups_max: 1            # listing URI
    consumed_cells: [listingState]
  quote:
    root_resolves_max: 1
    consumed_cells: []
    peeks: [listingState]
  book_request:
    root_resolves_max: 1               # resolveMany for payments, admin, provider, booking
    consumed_cells: [ledgerState short, listingState, bondState, bookingState]
    peeks: [adminState, providerState, listingState]
  accept:
    root_resolves_max: 0
    consumed_cells: [bookingState, listingState]
  cancel:
    root_resolves_max: 1
    consumed_cells: [bookingState held, listingState, bondState]
  settle:
    root_resolves_max: 1
    consumed_cells: [bookingState held, bondState]
  claim:
    root_resolves_max: 0
    consumed_cells: [bookingState]
  dispute:
    root_resolves_max: 0
    consumed_cells: [bookingState]
  arbitrate:
    root_resolves_max: 1               # AdminGuard
    consumed_cells: [bookingState held, bondState]
  pause_all:
    root_resolves_max: 0
    consumed_cells: [adminState]       # cold
