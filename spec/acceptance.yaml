# Milestone acceptance map. Each entry names the suite that must pass.
M0:
  static: [build-check, measure-check, check-arch, check-captures, check-select,
           check-placeholders, check-money, check-suites, check-allocator, parse-check]
M1:
  suite: unit_root
  also: unit_payments
M2:
  suite: unit_provider
  also: [unit_listing]
M3:
  suite: unit_booking
  also: [unit_allocator]
M4:
  suite: unit_lifecycle
M5:
  suite: unit_events
M6:
  suite: unit_admin
M7:
  suite: unit_generality
M8:
  suite: unit_all
  invariants: spec/invariants.md
M9:
  formal: [lean-check, vectors, check-flows]
  model: spec/lean
  flows: spec/flows
M10:
  rust: [client-lint, client-test, client-wasm]
  wasm: web/tests/wasm-smoke.mjs
  web: [typecheck, test, build]
  devnet: [client-fixtures, client-journey, web-e2e]
