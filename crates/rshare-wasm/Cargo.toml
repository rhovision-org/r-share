[package]
name = "rshare-wasm"
description = "WASM facade over the r-share SDK for the browser wallet and UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
rshare-core.workspace = true
rshare-keystore.workspace = true
rshare-sdk = { workspace = true, default-features = false, features = ["wasm"] }
rcash-chain = { workspace = true, default-features = false, features = ["wasm"] }
rchain-crypto.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
